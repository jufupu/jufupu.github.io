<!DOCTYPE html>
<html lang="en">
<!-- Previous head content and styles remain the same until the buttons styling -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A VERY IMPORTANT QUESTION!!</title>
  <style>
    /* Previous styles remain the same */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    
    .card-container {
      perspective: 1000px;
    }
    
    .card {
      width: 300px;
      height: 400px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
      cursor: pointer;
    }
    
    .card-front, .card-back {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    .card-front {
      background: #fff;
      color: #ff758c;
      font-size: 15px;
      text-align: center;
    }
    
    .card-back {
      background: #ff758c;
      color: #fff;
      transform: rotateY(180deg);
    }
    
    .card-front p {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
    
    .card-back h2 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }
    
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    /* Updated button styles */
    .button-wrapper {
      position: relative;
      width: 100px;  /* Fixed width for button container */
      height: 60px;  /* Fixed height to accommodate the button */
    }
    
    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #fff;
      color: #ff758c;
    }

    #yes-btn {
      position: relative;
    }

    #no-btn {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      top: 0;
      left: 0;
    }

    #no-btn .main-text {
      font-size: 18px;
    }

    #no-btn .sub-text {
      font-size: 12px;
      font-style: italic;
    }
    
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }
    
    .modal h3 {
      color: #ff758c;
      margin-bottom: 15px;
    }
    
    .modal img {
      max-width: 300px;
      margin-top: 15px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-front">
        <h1>💖 Hi Laura 💖</h1>
        <p>Click to continue</p>
      </div>
      <div class="card-back">
        <h2>Will you be my Valentine?</h2>
        <div class="buttons">
          <div class="button-wrapper">
            <button id="yes-btn">Yes!</button>
          </div>
          <div class="button-wrapper">
            <button id="no-btn">
              <span class="main-text">No</span>
              <span class="sub-text">(don't click me)</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" id="success-modal">
    <h3>Congrats! You've picked the right answer and your response has been recorded! 🎉</h3>
    <img src="https://media.giphy.com/media/W0Zub5okmASAM/giphy.gif" alt="Woody Dancing">
  </div>
  <canvas id="fireworksCanvas"></canvas>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.querySelector('.card');
      const noBtn = document.getElementById('no-btn');
      const modal = document.getElementById('success-modal');
      let isFlipped = false;

      const noBtnMessages = [
        "Stop that or no dinner",
        "Get ta fuck and click yes",
        "Yes is over there →",
        "Dafty",
        "Smelly",
        "Just click yes"
      ];

      let lastIndex = -1;

      noBtn.addEventListener('mouseover', () => {
        // Random position change for just the No button
        const randomX = (Math.random() - 0.5) * 300;
        const randomY = (Math.random() - 0.5) * 200;
        noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

        // Random message change
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * noBtnMessages.length);
        } while (newIndex === lastIndex);
        
        lastIndex = newIndex;
        noBtn.innerHTML = `
          <span class="main-text">No</span>
          <span class="sub-text">${noBtnMessages[newIndex]}</span>
        `;
      });

      noBtn.addEventListener('mouseout', () => {
        noBtn.innerHTML = `
          <span class="main-text">No</span>
          <span class="sub-text">(don't click me)</span>
        `;
      });

      card.addEventListener('click', () => {
        if (!isFlipped) {
          card.style.transform = 'rotateY(180deg)';
          isFlipped = true;
        }
      });

      const canvas = document.getElementById('fireworksCanvas');
      const ctx = canvas.getContext('2d');
      let fireworks = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function createFirework(x, y) {
        let particles = [];
        const colors = ['#ff0000', '#ff9900', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'];

        for (let i = 0; i < 30; i++) {
          const angle = (Math.PI * 2 * i) / 30;
          const speed = Math.random() * 3 + 2;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }

        fireworks.push(...particles);
      }

      function updateFireworks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = fireworks.length - 1; i >= 0; i--) {
          let p = fireworks[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.02;

          if (p.alpha <= 0) {
            fireworks.splice(i, 1);
            continue;
          }

          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(updateFireworks);
      }

      updateFireworks();

      document.getElementById('yes-btn').addEventListener('click', () => {
        // Create fireworks
        for (let i = 0; i < 5; i++) {
          createFirework(
            Math.random() * canvas.width,
            Math.random() * canvas.height
          );
        }
        
        // Show modal after a short delay
        setTimeout(() => {
          modal.style.display = 'block';
        }, 1000);
      });
    });
  </script>
</body>
</html>
